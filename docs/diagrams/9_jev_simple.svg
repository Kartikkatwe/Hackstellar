<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Segoe UI, Inter, Arial, sans-serif">
  <!-- How Jev works, in general: text + typed questions (each with its solution space) in, one probability per option out. -->
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4338CA"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="#FFFFFF"/>
  <text x="80" y="104" font-size="50" font-weight="700" fill="#1B2330">How Jev works</text>
  <text x="80" y="150" font-size="25" fill="#5B6676">Give it some text and questions. Each question comes with its own answer space. Jev can only answer inside it.</text>

  <!-- column heads -->
  <g font-size="18" font-weight="700" letter-spacing="2" fill="#5B6676">
    <text x="80" y="228">YOU GIVE IT</text>
    <text x="1180" y="228">IT GIVES BACK</text>
  </g>

  <!-- the text -->
  <rect x="80" y="248" width="700" height="96" rx="16" fill="#F3F4F8" stroke="#C9CEDA" stroke-width="2"/>
  <text x="108" y="290" font-size="17" font-weight="700" fill="#5B6676" letter-spacing="1.5">THE TEXT</text>
  <text x="108" y="324" font-size="24" fill="#1B2330">Any text: here, one customer complaint</text>

  <!-- three question types (input) -->
  <!-- noul -->
  <rect x="80" y="370" width="700" height="170" rx="16" fill="#F3F4F8" stroke="#C9CEDA" stroke-width="2"/>
  <rect x="108" y="394" width="104" height="36" rx="18" fill="#4338CA"/><text x="160" y="419" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">noul</text>
  <text x="232" y="420" font-size="24" font-weight="700" fill="#1B2330">A yes / no question</text>
  <text x="108" y="468" font-size="21" fill="#5B6676">Answer space: yes or no</text>
  <text x="108" y="510" font-size="21" fill="#1B2330">e.g. “Did the customer lose money?”</text>

  <!-- choice -->
  <rect x="80" y="562" width="700" height="190" rx="16" fill="#F3F4F8" stroke="#C9CEDA" stroke-width="2"/>
  <rect x="108" y="586" width="118" height="36" rx="18" fill="#4338CA"/><text x="167" y="611" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">choice</text>
  <text x="246" y="612" font-size="24" font-weight="700" fill="#1B2330">Pick one from a list</text>
  <text x="108" y="660" font-size="21" fill="#5B6676">Answer space: the options you name</text>
  <text x="108" y="702" font-size="21" fill="#1B2330">e.g. “Which area?” payments · delivery · …</text>
  <text x="108" y="734" font-size="18" fill="#5B6676">A new business just names different options. No training.</text>

  <!-- score -->
  <rect x="80" y="774" width="700" height="170" rx="16" fill="#F3F4F8" stroke="#C9CEDA" stroke-width="2"/>
  <rect x="108" y="798" width="104" height="36" rx="18" fill="#4338CA"/><text x="160" y="823" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">score</text>
  <text x="232" y="824" font-size="24" font-weight="700" fill="#1B2330">A level on a scale</text>
  <text x="108" y="872" font-size="21" fill="#5B6676">Answer space: ordered levels</text>
  <text x="108" y="914" font-size="21" fill="#1B2330">e.g. “How bad?” annoyed → … → harmed</text>

  <!-- arrows into Jev -->
  <g fill="none" stroke="#4338CA" stroke-width="3">
    <path d="M780 296 C840 296 850 560 898 590" marker-end="url(#ar)"/>
    <path d="M780 455 C830 455 850 590 898 605" marker-end="url(#ar)"/>
    <path d="M780 657 L898 625" marker-end="url(#ar)"/>
    <path d="M780 859 C830 859 850 660 898 645" marker-end="url(#ar)"/>
  </g>

  <!-- Jev -->
  <rect x="902" y="520" width="190" height="200" rx="24" fill="#4338CA"/>
  <text x="997" y="612" font-size="48" font-weight="700" fill="#FFFFFF" text-anchor="middle">Jev</text>
  <text x="997" y="648" font-size="18" fill="#E0E3FF" text-anchor="middle">one call,</text>
  <text x="997" y="672" font-size="18" fill="#E0E3FF" text-anchor="middle">all questions</text>

  <!-- arrows out -->
  <g fill="none" stroke="#4338CA" stroke-width="3">
    <path d="M1092 590 C1140 590 1130 455 1176 455" marker-end="url(#ar)"/>
    <path d="M1092 620 C1140 620 1130 657 1176 657" marker-end="url(#ar)"/>
    <path d="M1092 650 C1140 650 1130 859 1176 859" marker-end="url(#ar)"/>
  </g>

  <!-- outputs -->
  <!-- noul out -->
  <rect x="1180" y="370" width="660" height="170" rx="16" fill="#EEF0FF" stroke="#A5ABEF" stroke-width="2"/>
  <text x="1208" y="416" font-size="24" font-weight="700" fill="#1B2330">How likely “yes” is</text>
  <rect x="1208" y="448" width="460" height="22" rx="11" fill="#DADDF5"/><rect x="1208" y="448" width="414" height="22" rx="11" fill="#4338CA"/>
  <text x="1812" y="467" font-size="24" font-weight="700" fill="#1B2330" text-anchor="end">0.90</text>
  <text x="1208" y="512" font-size="19" fill="#5B6676">We decide the cut-off, e.g. 0.5 or above means yes</text>

  <!-- choice out -->
  <rect x="1180" y="562" width="660" height="190" rx="16" fill="#EEF0FF" stroke="#A5ABEF" stroke-width="2"/>
  <text x="1208" y="606" font-size="24" font-weight="700" fill="#1B2330">A probability for every option</text>
  <g font-size="19" fill="#1B2330">
    <text x="1208" y="646">payments</text><rect x="1360" y="632" width="360" height="16" rx="8" fill="#DADDF5"/><rect x="1360" y="632" width="306" height="16" rx="8" fill="#4338CA"/><text x="1812" y="646" text-anchor="end" font-weight="700">0.85</text>
    <text x="1208" y="680">refunds</text><rect x="1360" y="666" width="360" height="16" rx="8" fill="#DADDF5"/><rect x="1360" y="666" width="36" height="16" rx="8" fill="#8A93A3"/><text x="1812" y="680" text-anchor="end">0.10</text>
    <text x="1208" y="714">others</text><rect x="1360" y="700" width="360" height="16" rx="8" fill="#DADDF5"/><rect x="1360" y="700" width="18" height="16" rx="8" fill="#8A93A3"/><text x="1812" y="714" text-anchor="end">0.05</text>
  </g>
  <text x="1208" y="744" font-size="17" fill="#5B6676">Two close options? It is unsure, so we check both.</text>

  <!-- score out -->
  <rect x="1180" y="774" width="660" height="170" rx="16" fill="#EEF0FF" stroke="#A5ABEF" stroke-width="2"/>
  <text x="1208" y="820" font-size="24" font-weight="700" fill="#1B2330">A point on the scale</text>
  <line x1="1218" y1="862" x2="1812" y2="862" stroke="#C3C7EE" stroke-width="6" stroke-linecap="round"/>
  <g fill="#C3C7EE"><circle cx="1218" cy="862" r="9"/><circle cx="1416" cy="862" r="9"/><circle cx="1614" cy="862" r="9"/><circle cx="1812" cy="862" r="9"/></g>
  <circle cx="1495" cy="862" r="15" fill="#4338CA"/>
  <g font-size="17" fill="#5B6676" text-anchor="middle"><text x="1218" y="900">annoyed</text><text x="1416" y="900">inconvenienced</text><text x="1614" y="900">blocked</text><text x="1812" y="900" text-anchor="end">harmed</text></g>
  <text x="1495" y="840" font-size="20" font-weight="700" fill="#4338CA" text-anchor="middle">2.4</text>

  <!-- footer -->
  <rect x="80" y="980" width="1760" height="64" rx="14" fill="#F3F4F8"/>
  <text x="108" y="1021" font-size="22" fill="#1B2330"><tspan font-weight="700">No free text comes back.</tspan> Nothing to parse, almost nothing to pay for, and every answer says how sure it is.</text>
</svg>
