<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Segoe UI, Inter, Arial, sans-serif">
  <!-- Slide-sized (16:9). Left to right: a business's pack, what the pack file holds, the shared engine, what comes out.
       Telecom is marked planned: it is not built yet. -->
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="#FFFFFF"/>

  <text x="40" y="84" font-size="46" font-weight="700" fill="#1B2330">Domain-agnostic by design</text>
  <text x="40" y="122" font-size="22" fill="#5B6676">One engine. Each business plugs in a domain pack: one settings file, with no code changes and no model training.</text>

  <!-- column labels -->
  <g font-size="17" font-weight="700" fill="#5B6676" letter-spacing="1">
    <text x="40" y="168">DOMAIN PACKS</text>
    <text x="480" y="168">WHAT A PACK DEFINES</text>
    <text x="1000" y="168">SHARED ENGINE</text>
    <text x="1480" y="168">WHAT COMES OUT</text>
  </g>

  <!-- A: packs -->
  <g font-size="17" fill="#2B3440">
    <rect x="40" y="186" width="380" height="216" rx="14" fill="#E8F5EC" stroke="#15803D" stroke-width="2"/>
    <text x="62" y="222" font-size="23" font-weight="700" fill="#1B2330">Grocery · BasketNow</text>
    <rect x="62" y="236" width="150" height="28" rx="14" fill="#15803D"/>
    <text x="137" y="256" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Built · live demo</text>
    <text x="62" y="294">7 areas: payments, delivery, …</text>
    <text x="62" y="320">13 known issues with examples</text>
    <text x="62" y="346">Order ID BN-NNNNNN-C</text>
    <text x="62" y="372">Segments: state, age, student</text>

    <rect x="40" y="420" width="380" height="216" rx="14" fill="#FDF3E3" stroke="#B45309" stroke-width="2"/>
    <text x="62" y="456" font-size="23" font-weight="700" fill="#1B2330">Telecom</text>
    <rect x="62" y="470" width="96" height="28" rx="14" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/>
    <text x="110" y="490" font-size="15" font-weight="700" fill="#B45309" text-anchor="middle">Planned</text>
    <text x="62" y="528">Areas: network, billing,</text>
    <text x="62" y="554">recharge, SIM, broadband</text>
    <text x="62" y="580">Account number as the ID</text>
    <text x="62" y="606">Segments: circle, plan type</text>

    <rect x="40" y="654" width="380" height="216" rx="14" fill="#FFFFFF" stroke="#8A94A3" stroke-width="2" stroke-dasharray="9 7"/>
    <text x="62" y="690" font-size="23" font-weight="700" fill="#1B2330">Your business</text>
    <text x="62" y="728">Bank, airline, hospital,</text>
    <text x="62" y="754">e-commerce, utilities</text>
    <text x="62" y="792" font-weight="700">Write one pack file.</text>
    <text x="62" y="818">No code changes.</text>
    <text x="62" y="844">No model training.</text>
  </g>

  <!-- B: pack.yaml -->
  <rect x="480" y="186" width="460" height="684" rx="14" fill="#F4F6F9" stroke="#334155" stroke-width="2"/>
  <path d="M480 236 V200 a14 14 0 0 1 14 -14 H926 a14 14 0 0 1 14 14 V236 Z" fill="#334155"/>
  <text x="504" y="219" font-size="20" font-weight="700" fill="#FFFFFF" font-family="Consolas, Menlo, monospace">packs/grocery/pack.yaml</text>
  <g font-size="16" fill="#3B4552">
    <text x="504" y="276" font-size="20" font-weight="700" fill="#4338CA" font-family="Consolas, Menlo, monospace">components</text>
    <text x="504" y="302">7 areas, each with a one-line description</text>
    <text x="504" y="352" font-size="20" font-weight="700" fill="#4338CA" font-family="Consolas, Menlo, monospace">seed_issues</text>
    <text x="504" y="378">Known issues with example complaints</text>
    <text x="504" y="428" font-size="20" font-weight="700" fill="#4338CA" font-family="Consolas, Menlo, monospace">gate</text>
    <text x="504" y="454">Impact and emotion scales, risk questions</text>
    <text x="504" y="504" font-size="20" font-weight="700" fill="#4338CA" font-family="Consolas, Menlo, monospace">segments</text>
    <text x="504" y="530">Country, state, age group, student</text>
    <text x="504" y="580" font-size="20" font-weight="700" fill="#4338CA" font-family="Consolas, Menlo, monospace">order_id</text>
    <text x="504" y="606">Prefix BN, 6 digits, check digit</text>
    <text x="504" y="656" font-size="20" font-weight="700" fill="#4338CA" font-family="Consolas, Menlo, monospace">thresholds</text>
    <text x="504" y="682">File at 0.65, buffer below 0.18, verify yes 0.80</text>
    <text x="504" y="732" font-size="20" font-weight="700" fill="#4338CA" font-family="Consolas, Menlo, monospace">ranking</text>
    <text x="504" y="758">Anger weight, trend, Critical badge rules</text>
    <text x="504" y="808" font-size="20" font-weight="700" fill="#4338CA" font-family="Consolas, Menlo, monospace">models</text>
    <text x="504" y="834">Jev, Claude Haiku 5.5, local embedder, prices</text>
  </g>

  <!-- C: engine -->
  <rect x="1000" y="186" width="420" height="684" rx="14" fill="#FFFFFF" stroke="#1B2330" stroke-width="2"/>
  <path d="M1000 250 V200 a14 14 0 0 1 14 -14 H1406 a14 14 0 0 1 14 14 V250 Z" fill="#1B2330"/>
  <text x="1022" y="218" font-size="21" font-weight="700" fill="#FFFFFF">Core engine</text>
  <text x="1022" y="241" font-size="15" fill="#C9D1DC">The same code for every business</text>
  <g font-size="18" font-weight="700" fill="#1B2330">
    <circle cx="1030" cy="285" r="7" fill="#334155"/><text x="1048" y="291">Intake adapters <tspan font-size="15" font-weight="400" fill="#5B6676">email, call webhook, chat, social</tspan></text>
    <circle cx="1030" cy="352" r="7" fill="#334155"/><text x="1048" y="358">Identity <tspan font-size="15" font-weight="400" fill="#5B6676">order ID check digit, phone, handle</tspan></text>
    <circle cx="1030" cy="419" r="7" fill="#4338CA"/><text x="1048" y="425">Gate <tspan font-size="15" font-weight="400" fill="#5B6676">questions built from the pack</tspan></text>
    <circle cx="1030" cy="486" r="7" fill="#0F766E"/><text x="1048" y="492">Similarity match <tspan font-size="15" font-weight="400" fill="#5B6676">local, multilingual</tspan></text>
    <circle cx="1030" cy="553" r="7" fill="#4338CA"/><text x="1048" y="559">Verify <tspan font-size="15" font-weight="400" fill="#5B6676">yes / no on the top 3</tspan></text>
    <circle cx="1030" cy="620" r="7" fill="#B45309"/><text x="1048" y="626">Adjudicate and name <tspan font-size="15" font-weight="400" fill="#5B6676">unsure few only</tspan></text>
    <circle cx="1030" cy="687" r="7" fill="#B45309"/><text x="1048" y="693">Buffer and Curator <tspan font-size="15" font-weight="400" fill="#5B6676">new issues, merges</tspan></text>
    <circle cx="1030" cy="754" r="7" fill="#334155"/><text x="1048" y="760">Ranker and segments <tspan font-size="15" font-weight="400" fill="#5B6676">score, badges</tspan></text>
    <circle cx="1030" cy="821" r="7" fill="#334155"/><text x="1048" y="827">Cost and accuracy log <tspan font-size="15" font-weight="400" fill="#5B6676">every call</tspan></text>
  </g>
  <g stroke="#E3E7ED" stroke-width="1.5">
    <line x1="1020" y1="318" x2="1400" y2="318"/><line x1="1020" y1="385" x2="1400" y2="385"/><line x1="1020" y1="452" x2="1400" y2="452"/>
    <line x1="1020" y1="519" x2="1400" y2="519"/><line x1="1020" y1="586" x2="1400" y2="586"/><line x1="1020" y1="653" x2="1400" y2="653"/>
    <line x1="1020" y1="720" x2="1400" y2="720"/><line x1="1020" y1="787" x2="1400" y2="787"/>
  </g>

  <!-- D: outputs -->
  <g font-size="17" fill="#2B3440">
    <rect x="1480" y="186" width="400" height="160" rx="14" fill="#EEF1F5" stroke="#334155" stroke-width="2"/>
    <text x="1502" y="222" font-size="22" font-weight="700" fill="#1B2330">HTTP API</text>
    <text x="1502" y="256" font-family="Consolas, Menlo, monospace" font-size="16">/issues/top  /funnel  /cost</text>
    <text x="1502" y="282" font-family="Consolas, Menlo, monospace" font-size="16">/segments  /complaints</text>
    <text x="1502" y="308" font-family="Consolas, Menlo, monospace" font-size="16">/webhooks/call  /config</text>

    <rect x="1480" y="366" width="400" height="504" rx="14" fill="#EEF1F5" stroke="#334155" stroke-width="2"/>
    <text x="1502" y="402" font-size="22" font-weight="700" fill="#1B2330">Reusable screens <tspan font-size="16" font-weight="400" fill="#5B6676">frontend</tspan></text>
    <text x="1502" y="440">Top 10 board with badges</text>
    <text x="1502" y="468">Funnel and cost against an LLM</text>
    <text x="1502" y="496">Segment heatmap</text>
    <text x="1502" y="524">Issue detail and trend</text>
    <text x="1502" y="552">Unconfirmed and urgent reports</text>
    <text x="1502" y="580">Live complaint box</text>
    <text x="1502" y="608">Voice agent (webhook)</text>
    <line x1="1502" y1="640" x2="1858" y2="640" stroke="#C9D1DC" stroke-width="1.5"/>
    <text x="1502" y="676" font-weight="700">Nothing is hard-coded for grocery.</text>
    <text x="1502" y="704">Area names, segment names and</text>
    <text x="1502" y="730">severity labels all come from</text>
    <text x="1502" y="756">/config, so the same screens</text>
    <text x="1502" y="782">serve a telecom or a bank.</text>
  </g>

  <!-- arrows -->
  <g stroke="#64748B" stroke-width="4" marker-end="url(#ah)">
    <line x1="424" y1="528" x2="474" y2="528"/>
    <line x1="944" y1="528" x2="994" y2="528"/>
    <line x1="1424" y1="528" x2="1474" y2="528"/>
  </g>

  <!-- adding a business -->
  <rect x="40" y="900" width="1840" height="130" rx="16" fill="#F4F6F9"/>
  <text x="72" y="942" font-size="22" font-weight="700" fill="#1B2330">Adding a business</text>
  <g font-size="19" fill="#3B4552">
    <!-- SVG collapses repeated spaces, so the gaps are set with dx -->
    <text x="72" y="980"><tspan font-weight="700" fill="#1B2330">1</tspan><tspan dx="10">Write the pack file</tspan><tspan dx="44" font-weight="700" fill="#1B2330">2</tspan><tspan dx="10">Connect its channels</tspan><tspan dx="44" font-weight="700" fill="#1B2330">3</tspan><tspan dx="10">Tune cut-offs on a labelled sample</tspan><tspan dx="44" font-weight="700" fill="#1B2330">4</tspan><tspan dx="10">Run</tspan></text>
    <text x="72" y="1012">Jev takes its labels in each request and the LLM reads the pack's issue list, so no model is retrained for a new business.</text>
  </g>
</svg>
