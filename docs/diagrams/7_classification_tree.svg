<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Segoe UI, Inter, Arial, sans-serif">
  <!-- Judge-facing decision tree, no model names: shown before Jev is introduced. Questions are dark boxes, answers are leaves. -->
  <rect width="1920" height="1080" fill="#FFFFFF"/>
  <text x="60" y="70" font-size="42" font-weight="700" fill="#1B2330">How every complaint is classified</text>
  <text x="60" y="108" font-size="20" fill="#5B6676">Every complaint goes through the same few questions. Each answer sends it down one branch.</text>

  <g fill="none" stroke="#64748B" stroke-width="3">
    <path d="M700 167 H580"/>
    <path d="M960 199 V240"/>
    <path d="M700 275 H580"/>
    <path d="M960 310 V350"/>
    <path d="M1220 385 H1280"/>
    <path d="M960 420 V460"/>
    <path d="M960 530 V560 M460 560 H1460 M460 560 V600 M960 560 V600 M1460 560 V600"/>
    <path d="M1460 684 V720"/>
    <path d="M1460 786 V808 M1055 808 H1685 M1055 808 V830 M1340 808 V830 M1685 808 V830"/>
    <path d="M460 684 V740"/>
  </g>

  <!-- root and identity -->
  <rect x="700" y="135" width="520" height="64" rx="32" fill="#1B2330"/>
  <text x="960" y="164" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">A complaint arrives</text>
  <text x="960" y="188" font-size="16" fill="#C9D1DC" text-anchor="middle">email · call · chat · social post · any language</text>
  <rect x="60" y="135" width="520" height="64" rx="14" fill="#EEF1F5" stroke="#64748B" stroke-width="2"/>
  <text x="82" y="162" font-size="18" font-weight="700" fill="#1B2330">Who sent it? Linked to the customer,</text>
  <text x="82" y="186" font-size="17" fill="#3B4552">so one person on three channels counts once</text>

  <!-- Q1 -->
  <rect x="700" y="240" width="520" height="70" rx="14" fill="#312E81"/>
  <text x="960" y="284" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">Is it a complaint?</text>
  <rect x="60" y="243" width="520" height="64" rx="14" fill="#F1F2F4" stroke="#8A94A3" stroke-width="2"/>
  <text x="82" y="270" font-size="18" font-weight="700" fill="#4B5563">No → set aside</text>
  <text x="82" y="294" font-size="17" fill="#4B5563">praise, spam and general questions</text>
  <text x="975" y="337" font-size="16" font-weight="700" fill="#166534">yes</text>
  <text x="640" y="266" font-size="16" font-weight="700" fill="#4B5563" text-anchor="middle">no</text>

  <!-- Q2 -->
  <rect x="700" y="350" width="520" height="70" rx="14" fill="#312E81"/>
  <text x="960" y="394" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">What is it about?</text>
  <rect x="1280" y="330" width="580" height="110" rx="14" fill="#EEF1F5" stroke="#64748B" stroke-width="2"/>
  <text x="1302" y="358" font-size="18" font-weight="700" fill="#1B2330">Which part of the business</text>
  <text x="1302" y="382" font-size="16" fill="#3B4552">payments · delivery · order accuracy · product quality</text>
  <text x="1302" y="404" font-size="16" fill="#3B4552">refunds · account and app · customer support</text>
  <text x="1302" y="428" font-size="16" fill="#1B2330"><tspan font-weight="700">How serious:</tspan> severity · money lost · safety risk</text>

  <!-- Q3 -->
  <rect x="700" y="460" width="520" height="70" rx="14" fill="#312E81"/>
  <text x="960" y="504" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">Is it a problem we already know?</text>

  <rect x="220" y="600" width="480" height="84" rx="14" fill="#E8F5EC" stroke="#15803D" stroke-width="2"/>
  <text x="242" y="634" font-size="20" font-weight="700" fill="#166534">Yes → filed under that problem</text>
  <text x="242" y="662" font-size="17" fill="#166534">most complaints stop here</text>

  <rect x="720" y="600" width="480" height="84" rx="14" fill="#F4F6F9" stroke="#64748B" stroke-width="2"/>
  <text x="742" y="634" font-size="20" font-weight="700" fill="#1B2330">Not sure → checked more closely</text>
  <text x="742" y="662" font-size="17" fill="#3B4552">then filed, or sent to the waiting list</text>

  <rect x="1220" y="600" width="480" height="84" rx="14" fill="#EEF1F5" stroke="#334155" stroke-width="2"/>
  <text x="1242" y="634" font-size="20" font-weight="700" fill="#1B2330">No → waiting list</text>
  <text x="1242" y="662" font-size="17" fill="#3B4552">waits for similar complaints to arrive</text>

  <!-- Q4 -->
  <rect x="1180" y="720" width="560" height="66" rx="14" fill="#312E81"/>
  <text x="1460" y="761" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">Have 3 different customers reported it?</text>

  <rect x="920" y="830" width="270" height="92" rx="14" fill="#E8F5EC" stroke="#15803D" stroke-width="2"/>
  <text x="940" y="864" font-size="19" font-weight="700" fill="#166534">Yes → new problem</text>
  <text x="940" y="892" font-size="16" fill="#166534">named, added and ranked</text>

  <rect x="1205" y="830" width="270" height="92" rx="14" fill="#F1F2F4" stroke="#8A94A3" stroke-width="2"/>
  <text x="1225" y="864" font-size="19" font-weight="700" fill="#4B5563">Not yet → waits</text>
  <text x="1225" y="892" font-size="16" fill="#4B5563">staff can still see it</text>

  <rect x="1490" y="830" width="390" height="92" rx="14" fill="#FDECEC" stroke="#B91C1C" stroke-width="2"/>
  <text x="1510" y="864" font-size="19" font-weight="700" fill="#991B1B">Money lost or safety risk?</text>
  <text x="1510" y="892" font-size="16" fill="#991B1B">→ urgent at once, even from one report</text>

  <!-- rank -->
  <rect x="60" y="740" width="800" height="124" rx="14" fill="#E7E9FB" stroke="#4338CA" stroke-width="2"/>
  <text x="84" y="780" font-size="22" font-weight="700" fill="#312E81">Ranked into the Top 10</text>
  <text x="84" y="812" font-size="18" fill="#1B2330">customers affected × severity × money lost × anger × growth</text>
  <text x="84" y="842" font-size="17" fill="#3B4552">each score is written out, so anyone can check it</text>

  <rect x="60" y="980" width="1800" height="64" rx="14" fill="#F4F6F9"/>
  <text x="90" y="1020" font-size="20" fill="#1B2330"><tspan font-weight="700">Notice:</tspan> every step is a choice from fixed options. Yes or no, one of seven areas, a known problem or not.</text>
</svg>
