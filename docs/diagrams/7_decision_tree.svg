<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1240" viewBox="0 0 1920 1240" font-family="Segoe UI, Inter, Arial, sans-serif">
<!-- Every decision with its exact cut-off, from packs/grocery/pack.yaml and app/pipeline/engine.py (hybrid embedder). -->
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs>
<rect width="1920" height="1240" fill="#FFFFFF"/>
<text x="40" y="62" font-size="40" font-weight="700" fill="#1B2330">How every decision is made, with the exact settings</text>
<text x="40" y="100" font-size="18" fill="#5B6676">P = a probability from Jev (0 to 1). Score = similarity from the local model (0 to 1). Colour shows who decides: <tspan fill="#4338CA" font-weight="700">Jev</tspan> picks from options, <tspan fill="#0F766E" font-weight="700">Local</tspan> is free on our machine, <tspan fill="#B45309" font-weight="700">LLM</tspan> only where words are needed.</text>
<line x1="90" y1="218" x2="90" y2="230" stroke="#64748B" stroke-width="3" marker-end="url(#ah)"/>
<line x1="640" y1="179.0" x2="1094" y2="179.0" stroke="#0F766E" stroke-width="2.5"/>
<rect x="40" y="140" width="600" height="78" rx="12" fill="#E6F4F2" stroke="#0F766E" stroke-width="2"/>
<text x="60" y="168" font-size="21" font-weight="700" fill="#0F766E">1 · Received as written</text>
<text x="620" y="167" font-size="14" font-weight="700" letter-spacing="1.5" fill="#0F766E" text-anchor="end">LOCAL · FREE</text>
<text x="60" y="192" font-size="16" fill="#2B3440" xml:space="preserve">no cleaning: the customer&#x27;s exact words go on</text>
<rect x="690" y="162.0" width="380" height="34" rx="17" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="708" y="185.0" font-size="17" font-weight="600" fill="#475569">Who sent it: login, phone, email or handle</text>
<rect x="1094" y="149.0" width="380" height="60" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="1112" y="174.0" font-size="17" font-weight="600" fill="#475569">Order ID used only if: check digit valid,</text>
<text x="1112" y="196.0" font-size="17" font-weight="400" fill="#475569">order exists, one more signal agrees</text>
<line x1="90" y1="310" x2="90" y2="322" stroke="#64748B" stroke-width="3" marker-end="url(#ah)"/>
<line x1="640" y1="271.0" x2="1094" y2="271.0" stroke="#4338CA" stroke-width="2.5"/>
<rect x="40" y="232" width="600" height="78" rx="12" fill="#EEF0FF" stroke="#4338CA" stroke-width="2"/>
<text x="60" y="260" font-size="21" font-weight="700" fill="#4338CA">2 · Gate: is it a complaint?</text>
<text x="620" y="259" font-size="14" font-weight="700" letter-spacing="1.5" fill="#4338CA" text-anchor="end">JEV</text>
<text x="60" y="284" font-size="16" fill="#2B3440" xml:space="preserve">p = probability that it is a complaint</text>
<text x="60" y="304" font-size="16" fill="#2B3440" xml:space="preserve">same call also scores area, impact, emotion, money, legal</text>
<rect x="690" y="241.0" width="380" height="60" rx="14" fill="#F1F2F4" stroke="#8A94A3" stroke-width="2"/>
<text x="708" y="266.0" font-size="17" font-weight="600" fill="#4B5563">p &lt; 0.50 → dropped</text>
<text x="708" y="288.0" font-size="17" font-weight="400" fill="#4B5563">praise, spam, questions</text>
<rect x="1094" y="254.0" width="380" height="34" rx="17" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
<text x="1112" y="277.0" font-size="17" font-weight="600" fill="#1B2330">p ≥ 0.50 → step 3</text>
<line x1="90" y1="402" x2="90" y2="414" stroke="#64748B" stroke-width="3" marker-end="url(#ah)"/>
<line x1="640" y1="363.0" x2="1498" y2="363.0" stroke="#4338CA" stroke-width="2.5"/>
<rect x="40" y="324" width="600" height="78" rx="12" fill="#EEF0FF" stroke="#4338CA" stroke-width="2"/>
<text x="60" y="352" font-size="21" font-weight="700" fill="#4338CA">3 · Which area to search?</text>
<text x="620" y="351" font-size="14" font-weight="700" letter-spacing="1.5" fill="#4338CA" text-anchor="end">JEV</text>
<text x="60" y="376" font-size="16" fill="#2B3440" xml:space="preserve">7 areas, one probability each</text>
<rect x="690" y="346.0" width="380" height="34" rx="17" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
<text x="708" y="369.0" font-size="17" font-weight="600" fill="#1B2330">Top area always searched</text>
<rect x="1094" y="333.0" width="380" height="60" rx="14" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
<text x="1112" y="358.0" font-size="17" font-weight="600" fill="#1B2330">2nd area too if within 0.15</text>
<text x="1112" y="380.0" font-size="17" font-weight="400" fill="#1B2330">of the top one</text>
<rect x="1498" y="333.0" width="380" height="60" rx="14" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
<text x="1516" y="358.0" font-size="17" font-weight="600" fill="#1B2330">Calls: the IVR key pressed</text>
<text x="1516" y="380.0" font-size="17" font-weight="400" fill="#1B2330">is added as a hint</text>
<line x1="90" y1="494" x2="90" y2="506" stroke="#64748B" stroke-width="3" marker-end="url(#ah)"/>
<line x1="640" y1="455.0" x2="1498" y2="455.0" stroke="#0F766E" stroke-width="2.5"/>
<rect x="40" y="416" width="600" height="78" rx="12" fill="#E6F4F2" stroke="#0F766E" stroke-width="2"/>
<text x="60" y="444" font-size="21" font-weight="700" fill="#0F766E">4 · Similarity match</text>
<text x="620" y="443" font-size="14" font-weight="700" letter-spacing="1.5" fill="#0F766E" text-anchor="end">LOCAL · FREE</text>
<text x="60" y="468" font-size="16" fill="#2B3440" xml:space="preserve">score = 0.5 × issue centre</text>
<text x="60" y="488" font-size="16" fill="#2B3440" xml:space="preserve">          + 0.5 × closest example</text>
<rect x="690" y="438.0" width="380" height="34" rx="17" fill="#E8F5EC" stroke="#15803D" stroke-width="2"/>
<text x="708" y="461.0" font-size="17" font-weight="600" fill="#166534">score ≥ 0.65 → filed, free</text>
<rect x="1094" y="438.0" width="380" height="34" rx="17" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
<text x="1112" y="461.0" font-size="17" font-weight="600" fill="#1B2330">0.18 to 0.65 → step 5</text>
<rect x="1498" y="438.0" width="380" height="34" rx="17" fill="#F4F6F9" stroke="#94A3B8" stroke-width="2"/>
<text x="1516" y="461.0" font-size="17" font-weight="600" fill="#334155">score &lt; 0.18 → waiting list</text>
<line x1="90" y1="586" x2="90" y2="598" stroke="#64748B" stroke-width="3" marker-end="url(#ah)"/>
<line x1="640" y1="547.0" x2="1498" y2="547.0" stroke="#4338CA" stroke-width="2.5"/>
<rect x="40" y="508" width="600" height="78" rx="12" fill="#EEF0FF" stroke="#4338CA" stroke-width="2"/>
<text x="60" y="536" font-size="21" font-weight="700" fill="#4338CA">5 · Verify: same problem?</text>
<text x="620" y="535" font-size="14" font-weight="700" letter-spacing="1.5" fill="#4338CA" text-anchor="end">JEV</text>
<text x="60" y="560" font-size="16" fill="#2B3440" xml:space="preserve">P(same) for each of the top 3 issues</text>
<rect x="690" y="530.0" width="380" height="34" rx="17" fill="#E8F5EC" stroke="#15803D" stroke-width="2"/>
<text x="708" y="553.0" font-size="17" font-weight="600" fill="#166534">best P ≥ 0.80 → filed</text>
<rect x="1094" y="530.0" width="380" height="34" rx="17" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
<text x="1112" y="553.0" font-size="17" font-weight="600" fill="#1B2330">anything else → step 6</text>
<rect x="1498" y="530.0" width="380" height="34" rx="17" fill="#F4F6F9" stroke="#94A3B8" stroke-width="2"/>
<text x="1516" y="553.0" font-size="17" font-weight="600" fill="#334155">all P ≤ 0.20 → waiting list</text>
<line x1="90" y1="678" x2="90" y2="690" stroke="#64748B" stroke-width="3" marker-end="url(#ah)"/>
<line x1="640" y1="639.0" x2="1498" y2="639.0" stroke="#B45309" stroke-width="2.5"/>
<rect x="40" y="600" width="600" height="78" rx="12" fill="#FDF3E3" stroke="#B45309" stroke-width="2"/>
<text x="60" y="628" font-size="21" font-weight="700" fill="#B45309">6 · Decide</text>
<text x="620" y="627" font-size="14" font-weight="700" letter-spacing="1.5" fill="#B45309" text-anchor="end">LLM</text>
<text x="60" y="652" font-size="16" fill="#2B3440" xml:space="preserve">Claude Haiku 5.5 · temperature 0</text>
<text x="60" y="672" font-size="16" fill="#2B3440" xml:space="preserve">effort low · 1,024 tokens · 1 retry</text>
<rect x="690" y="622.0" width="380" height="34" rx="17" fill="#E8F5EC" stroke="#15803D" stroke-width="2"/>
<text x="708" y="645.0" font-size="17" font-weight="600" fill="#166534">picks a known issue → filed</text>
<rect x="1094" y="609.0" width="380" height="60" rx="14" fill="#F4F6F9" stroke="#94A3B8" stroke-width="2"/>
<text x="1112" y="634.0" font-size="17" font-weight="600" fill="#334155">says new, or unreadable</text>
<text x="1112" y="656.0" font-size="17" font-weight="400" fill="#334155">→ waiting list</text>
<rect x="1498" y="609.0" width="380" height="60" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="1516" y="634.0" font-size="17" font-weight="600" fill="#475569">Steps 5 and 6 save the wording</text>
<text x="1516" y="656.0" font-size="17" font-weight="400" fill="#475569">as an example (max 25 per issue)</text>
<line x1="90" y1="770" x2="90" y2="782" stroke="#64748B" stroke-width="3" marker-end="url(#ah)"/>
<line x1="640" y1="731.0" x2="1498" y2="731.0" stroke="#0F766E" stroke-width="2.5"/>
<rect x="40" y="692" width="600" height="78" rx="12" fill="#E6F4F2" stroke="#0F766E" stroke-width="2"/>
<text x="60" y="720" font-size="21" font-weight="700" fill="#0F766E">7 · Waiting list</text>
<text x="620" y="719" font-size="14" font-weight="700" letter-spacing="1.5" fill="#0F766E" text-anchor="end">LOCAL · FREE</text>
<text x="60" y="744" font-size="16" fill="#2B3440" xml:space="preserve">group = waiting complaints in the same</text>
<text x="60" y="764" font-size="16" fill="#2B3440" xml:space="preserve">area within 0.50 of the newest one</text>
<rect x="690" y="701.0" width="380" height="60" rx="14" fill="#FDECEC" stroke="#B91C1C" stroke-width="2"/>
<text x="708" y="726.0" font-size="17" font-weight="600" fill="#991B1B">money lost ≥ 0.50 or legal risk</text>
<text x="708" y="748.0" font-size="17" font-weight="400" fill="#991B1B">≥ 0.50 → urgent at once</text>
<rect x="1094" y="701.0" width="380" height="60" rx="14" fill="#F4F6F9" stroke="#94A3B8" stroke-width="2"/>
<text x="1112" y="726.0" font-size="17" font-weight="600" fill="#334155">&lt; 3 linked customers</text>
<text x="1112" y="748.0" font-size="17" font-weight="400" fill="#334155">→ keeps waiting</text>
<rect x="1498" y="714.0" width="380" height="34" rx="17" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
<text x="1516" y="737.0" font-size="17" font-weight="600" fill="#1B2330">≥ 3 linked customers → step 8</text>
<line x1="90" y1="862" x2="90" y2="874" stroke="#64748B" stroke-width="3" marker-end="url(#ah)"/>
<line x1="640" y1="823.0" x2="1094" y2="823.0" stroke="#4338CA" stroke-width="2.5"/>
<rect x="40" y="784" width="600" height="78" rx="12" fill="#EEF0FF" stroke="#4338CA" stroke-width="2"/>
<text x="60" y="812" font-size="21" font-weight="700" fill="#4338CA">8 · Group check</text>
<text x="620" y="811" font-size="14" font-weight="700" letter-spacing="1.5" fill="#4338CA" text-anchor="end">JEV</text>
<text x="60" y="836" font-size="16" fill="#2B3440" xml:space="preserve">3 most typical reports vs</text>
<text x="60" y="856" font-size="16" fill="#2B3440" xml:space="preserve">the top 3 known issues</text>
<rect x="690" y="793.0" width="380" height="60" rx="14" fill="#E8F5EC" stroke="#15803D" stroke-width="2"/>
<text x="708" y="818.0" font-size="17" font-weight="600" fill="#166534">P ≥ 0.80 → filed under</text>
<text x="708" y="840.0" font-size="17" font-weight="400" fill="#166534">that known issue</text>
<rect x="1094" y="806.0" width="380" height="34" rx="17" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
<text x="1112" y="829.0" font-size="17" font-weight="600" fill="#1B2330">otherwise → step 9</text>
<line x1="90" y1="954" x2="90" y2="988" stroke="#64748B" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#ah)"/>
<line x1="640" y1="915.0" x2="1094" y2="915.0" stroke="#B45309" stroke-width="2.5"/>
<rect x="40" y="876" width="600" height="78" rx="12" fill="#FDF3E3" stroke="#B45309" stroke-width="2"/>
<text x="60" y="904" font-size="21" font-weight="700" fill="#B45309">9 · Name the new issue</text>
<text x="620" y="903" font-size="14" font-weight="700" letter-spacing="1.5" fill="#B45309" text-anchor="end">LLM</text>
<text x="60" y="928" font-size="16" fill="#2B3440" xml:space="preserve">reads the 5 most typical reports</text>
<text x="60" y="948" font-size="16" fill="#2B3440" xml:space="preserve">title of at most 8 words</text>
<rect x="690" y="898.0" width="380" height="34" rx="17" fill="#E8F5EC" stroke="#15803D" stroke-width="2"/>
<text x="708" y="921.0" font-size="17" font-weight="600" fill="#166534">new issue added</text>
<rect x="1094" y="885.0" width="380" height="60" rx="14" fill="#E8F5EC" stroke="#15803D" stroke-width="2"/>
<text x="1112" y="910.0" font-size="17" font-weight="600" fill="#166534">waiting complaints scoring</text>
<text x="1112" y="932.0" font-size="17" font-weight="400" fill="#166534">≥ 0.65 against it join it</text>
<line x1="90" y1="1068" x2="90" y2="1080" stroke="#64748B" stroke-width="3" marker-end="url(#ah)"/>
<line x1="640" y1="1029.0" x2="1498" y2="1029.0" stroke="#B45309" stroke-width="2.5"/>
<rect x="40" y="990" width="600" height="78" rx="12" fill="#FDF3E3" stroke="#B45309" stroke-width="2"/>
<text x="60" y="1018" font-size="21" font-weight="700" fill="#B45309">10 · Remove duplicates</text>
<text x="620" y="1017" font-size="14" font-weight="700" letter-spacing="1.5" fill="#B45309" text-anchor="end">LLM</text>
<text x="60" y="1042" font-size="16" fill="#2B3440" xml:space="preserve">each new issue vs its 4 nearest</text>
<text x="60" y="1062" font-size="16" fill="#2B3440" xml:space="preserve">issues (by centre) in the same area</text>
<rect x="690" y="999.0" width="380" height="60" rx="14" fill="#E8F5EC" stroke="#15803D" stroke-width="2"/>
<text x="708" y="1024.0" font-size="17" font-weight="600" fill="#166534">same root cause → merged,</text>
<text x="708" y="1046.0" font-size="17" font-weight="400" fill="#166534">recorded, never deleted</text>
<rect x="1094" y="1012.0" width="380" height="34" rx="17" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="1112" y="1035.0" font-size="17" font-weight="600" fill="#475569">different → kept separate</text>
<rect x="1498" y="999.0" width="380" height="60" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="1516" y="1024.0" font-size="17" font-weight="600" fill="#475569">company-named issues</text>
<text x="1516" y="1046.0" font-size="17" font-weight="400" fill="#475569">keep their name</text>
<line x1="640" y1="1121.0" x2="1498" y2="1121.0" stroke="#0F766E" stroke-width="2.5"/>
<rect x="40" y="1082" width="600" height="78" rx="12" fill="#E6F4F2" stroke="#0F766E" stroke-width="2"/>
<text x="60" y="1110" font-size="21" font-weight="700" fill="#0F766E">11 · Rank</text>
<text x="620" y="1109" font-size="14" font-weight="700" letter-spacing="1.5" fill="#0F766E" text-anchor="end">LOCAL · FREE</text>
<text x="60" y="1134" font-size="16" fill="#2B3440" xml:space="preserve">customers × impact (1–4) × (1 + money share)</text>
<text x="60" y="1154" font-size="16" fill="#2B3440" xml:space="preserve">× (1 + 0.25 × anger share) × trend</text>
<rect x="690" y="1091.0" width="380" height="60" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="708" y="1116.0" font-size="17" font-weight="600" fill="#475569">trend × 1.25 if ≥ 5 customers in the</text>
<text x="708" y="1138.0" font-size="17" font-weight="400" fill="#475569">last 7 days and ≥ 2× the 7 before</text>
<rect x="1094" y="1091.0" width="380" height="60" rx="14" fill="#FDECEC" stroke="#B91C1C" stroke-width="2"/>
<text x="1112" y="1116.0" font-size="17" font-weight="600" fill="#991B1B">Critical: ≥ 3 complaints and money</text>
<text x="1112" y="1138.0" font-size="17" font-weight="400" fill="#991B1B">share ≥ 0.50 or legal share ≥ 0.05</text>
<rect x="1498" y="1091.0" width="380" height="60" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="1516" y="1116.0" font-size="17" font-weight="600" fill="#475569">Others: High, Medium, Low</text>
<text x="1516" y="1138.0" font-size="17" font-weight="400" fill="#475569">by thirds of the ranked list</text>
<line x1="40" y1="973" x2="1880" y2="973" stroke="#C9D1DC" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="1650" y="961" width="230" height="24" fill="#FFFFFF"/>
<text x="1880" y="979" font-size="15" font-weight="700" letter-spacing="1.5" fill="#64748B" text-anchor="end">AFTER EACH BATCH</text>
<text x="40" y="1204" font-size="18" fill="#1B2330"><tspan font-weight="700">Counting rules for the rank:</tspan> money lost and legal risk count at P ≥ 0.50 · angry at emotion ≥ 1.5 on 0–3 · each linked customer counted once · thresholds live in packs/grocery/pack.yaml</text>
</svg>